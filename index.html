
<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Drive Audio Library</title>

  <style>
    :root {
      --bg: #0b1020;
      --panel: #131b2e;
      --panel2: #19243a;
      --text: #f4f7ff;
      --muted: #a3afc8;
      --accent: #8b7cff;
      --accent2: #38d9b5;
      --border: rgba(255,255,255,.09);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        radial-gradient(ellipse at top left, #20204b 0, transparent 42%),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      padding-bottom: 145px;
    }

    button, input {
      font: inherit;
    }

    .container {
      width: min(100% - 32px, 1000px);
      margin: 0 auto;
    }

    header {
      padding: 42px 0 25px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      border-radius: 17px;
      background: linear-gradient(135deg, var(--accent), #42d9c0);
      color: #10152a;
      font-size: 26px;
      font-weight: 900;
      flex-shrink: 0;
    }

    h1 {
      font-size: clamp(25px, 5vw, 38px);
      margin: 0 0 7px;
      letter-spacing: -.8px;
    }

    .subtitle {
      color: var(--muted);
      margin: 0;
      font-size: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin: 18px 0 24px;
    }

    .stat {
      padding: 18px;
      background: rgba(19, 27, 46, .88);
      border: 1px solid var(--border);
      border-radius: 18px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 25px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 17px;
    }

    .search-wrap {
      flex: 1;
      position: relative;
      min-width: 0;
    }

    .search-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      opacity: .7;
    }

    #search {
      width: 100%;
      min-width: 0;
      padding: 14px 14px 14px 43px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 13px;
      outline: none;
    }

    #search:focus {
      border-color: var(--accent);
    }

    .button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 14px;
      color: var(--text);
      background: var(--panel2);
      text-decoration: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      transition: transform .15s, opacity .15s;
    }

    .button:hover {
      transform: translateY(-1px);
      opacity: .9;
    }

    .button:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
    }

    .button.primary {
      background: var(--accent);
      color: #fff;
      border-color: transparent;
    }

    .button.download {
      color: var(--accent2);
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 25px 0 13px;
    }

    .section-heading h2 {
      font-size: 18px;
      margin: 0;
    }

    #resultCount {
      color: var(--muted);
      font-size: 12px;
    }

    #message {
      display: none;
      padding: 17px;
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--muted);
      line-height: 1.6;
      background: var(--panel);
      margin: 15px 0;
      overflow-wrap: anywhere;
    }

    .file-list {
      display: grid;
      gap: 10px;
    }

    .file {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 14px;
      border: 1px solid var(--border);
      background: rgba(19, 27, 46, .88);
      border-radius: 16px;
      min-width: 0;
      transition: border-color .15s, background .15s;
    }

    .file:hover {
      border-color: rgba(139,124,255,.55);
    }

    .file.active {
      border-color: var(--accent);
      background: rgba(139,124,255,.10);
    }

    .file-icon {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: #24284b;
      font-size: 21px;
    }

    .file-info {
      flex: 1;
      min-width: 0;
    }

    .file-name {
      font-weight: 700;
      line-height: 1.4;
      overflow-wrap: anywhere;
      margin-bottom: 5px;
    }

    .file-meta {
      color: var(--muted);
      font-size: 12px;
    }

    .file-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .play-small {
      background: rgba(139,124,255,.15);
      border-color: rgba(139,124,255,.3);
    }

    .empty {
      padding: 35px 18px;
      text-align: center;
      color: var(--muted);
      background: var(--panel);
      border: 1px dashed var(--border);
      border-radius: 16px;
      line-height: 1.7;
    }

    .player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      background: rgba(11,16,32,.96);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(18px);
      padding: 14px 0 calc(14px + env(safe-area-inset-bottom));
    }

    .player-inner {
      width: min(100% - 32px, 1000px);
      margin: 0 auto;
    }

    .now-playing {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      min-width: 0;
    }

    .now-icon {
      font-size: 20px;
    }

    .now-text {
      min-width: 0;
      flex: 1;
    }

    .now-label {
      font-size: 11px;
      color: var(--accent2);
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: .8px;
    }

    #nowTitle {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    audio {
      display: block;
      width: 100%;
      height: 40px;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 25px 0;
    }

    @media (max-width: 600px) {
      header {
        padding-top: 28px;
      }

      .container {
        width: min(100% - 22px, 1000px);
      }

      .stats {
        gap: 9px;
      }

      .stat {
        padding: 14px;
      }

      .stat-value {
        font-size: 21px;
      }

      .toolbar {
        flex-wrap: wrap;
      }

      .search-wrap {
        flex-basis: 100%;
      }

      .toolbar > .button {
        flex: 1;
      }

      .file {
        gap: 9px;
        padding: 11px;
      }

      .file-icon {
        width: 38px;
        height: 38px;
      }

      .file-actions {
        gap: 5px;
      }

      .file-actions .button {
        padding: 10px;
        min-width: 38px;
      }

      .button-label {
        display: none;
      }

      .player-inner {
        width: calc(100% - 22px);
      }
    }
  </style>
</head>

<body>
  <header class="container">
    <div class="brand">
      <div class="logo">♫</div>
      <div>
        <h1>Audio Library</h1>
        <p class="subtitle">Your music and audio collection in one place.</p>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="stats">
      <div class="stat">
        <div class="stat-label">Total audio files</div>
        <div class="stat-value" id="totalFiles">—</div>
      </div>

      <div class="stat">
        <div class="stat-label">Total size</div>
        <div class="stat-value" id="totalSize">—</div>
      </div>
    </section>

    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input
          type="search"
          id="search"
          placeholder="Search audio files..."
          aria-label="Search audio files"
          autocomplete="off"
        >
      </div>

      <button class="button" id="refreshBtn" type="button">
        ↻ Refresh
      </button>
    </div>

    <div class="section-heading">
      <h2>Your audio files</h2>
      <span id="resultCount">Loading...</span>
    </div>

    <div id="message" role="status"></div>
    <div id="fileList" class="file-list"></div>

    <footer>
      Drive Audio Library
    </footer>
  </main>

  <section class="player">
    <div class="player-inner">
      <div class="now-playing">
        <span class="now-icon">♫</span>
        <div class="now-text">
          <div class="now-label">Now playing</div>
          <div id="nowTitle">Choose an audio file to play</div>
        </div>
      </div>

      <audio id="audioPlayer" controls preload="none">
        Your browser does not support audio playback.
      </audio>
    </div>
  </section>

  <script>
    const state = {
      files: [],
      currentId: null
    };

    const fileList = document.getElementById('fileList');
    const searchInput = document.getElementById('search');
    const message = document.getElementById('message');
    const player = document.getElementById('audioPlayer');
    const nowTitle = document.getElementById('nowTitle');
    const refreshBtn = document.getElementById('refreshBtn');

    function formatSize(bytes) {
      if (bytes === 0) return '0 B';
      if (!bytes || bytes < 0) return 'Unknown size';

      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      const index = Math.min(
        Math.floor(Math.log(bytes) / Math.log(1024)),
        units.length - 1
      );

      return (bytes / Math.pow(1024, index)).toFixed(
        index === 0 ? 0 : 1
      ) + ' ' + units[index];
    }

    function showMessage(text) {
      message.textContent = text;
      message.style.display = 'block';
    }

    function hideMessage() {
      message.textContent = '';
      message.style.display = 'none';
    }

    function loadFiles() {
      refreshBtn.disabled = true;
      refreshBtn.textContent = 'Loading...';
      fileList.replaceChildren();
      showMessage('Loading audio files from Google Drive...');

      google.script.run
        .withSuccessHandler(function(files) {
          state.files = Array.isArray(files) ? files : [];

          document.getElementById('totalFiles').textContent =
            state.files.length;

          const totalBytes = state.files.reduce(function(total, file) {
            return total + (Number(file.size) || 0);
          }, 0);

          document.getElementById('totalSize').textContent =
            formatSize(totalBytes);

          refreshBtn.disabled = false;
          refreshBtn.textContent = '↻ Refresh';

          renderFiles();
        })
        .withFailureHandler(function(error) {
          refreshBtn.disabled = false;
          refreshBtn.textContent = '↻ Refresh';

          showMessage(
            'Could not load audio files. Check the folder ID, ' +
            'Apps Script permissions, and deployment settings. ' +
            (error && error.message ? error.message : '')
          );

          document.getElementById('resultCount').textContent =
            'Loading failed';
        })
        .getAudioFiles();
    }

    function renderFiles() {
      const query = searchInput.value.trim().toLowerCase();

      const filtered = state.files.filter(function(file) {
        return file.name.toLowerCase().includes(query);
      });

      fileList.replaceChildren();
      document.getElementById('resultCount').textContent =
        filtered.length + (filtered.length === 1 ? ' file' : ' files');

      hideMessage();

      if (state.files.length === 0) {
        showMessage(
          'No audio files were found in this folder. ' +
          'Make sure it contains audio files and that the script ' +
          'has permission to access it.'
        );
        return;
      }

      if (filtered.length === 0) {
        showMessage('No files match your search.');
        return;
      }

      filtered.forEach(function(file) {
        const card = document.createElement('article');
        card.className = 'file';

        if (file.id === state.currentId) {
          card.classList.add('active');
        }

        const icon = document.createElement('div');
        icon.className = 'file-icon';
        icon.textContent = '♫';

        const info = document.createElement('div');
        info.className = 'file-info';

        const name = document.createElement('div');
        name.className = 'file-name';
        name.textContent = file.name;
        name.title = file.name;

        const meta = document.createElement('div');
        meta.className = 'file-meta';
        meta.textContent = formatSize(Number(file.size) || 0);

        info.appendChild(name);
        info.appendChild(meta);

        const actions = document.createElement('div');
        actions.className = 'file-actions';

        const playBtn = document.createElement('button');
        playBtn.type = 'button';
        playBtn.className = 'button play-small';
        playBtn.innerHTML = '<span>▶</span><span class="button-label">Play</span>';
        playBtn.title = 'Play audio';
        playBtn.setAttribute('aria-label', 'Play ' + file.name);

        playBtn.addEventListener('click', function() {
          playFile(file);
        });

        const downloadBtn = document.createElement('a');
        downloadBtn.className = 'button download';
        downloadBtn.href = file.downloadUrl;
        downloadBtn.target = '_blank';
        downloadBtn.rel = 'noopener noreferrer';
        downloadBtn.innerHTML =
          '<span>↓</span><span class="button-label">Download</span>';
        downloadBtn.title = 'Download audio';
        downloadBtn.setAttribute('aria-label', 'Download ' + file.name);

        const driveBtn = document.createElement('a');
        driveBtn.className = 'button';
        driveBtn.href = file.driveUrl;
        driveBtn.target = '_blank';
        driveBtn.rel = 'noopener noreferrer';
        driveBtn.innerHTML =
          '<span>↗</span><span class="button-label">Drive</span>';
        driveBtn.title = 'Open in Google Drive';
        driveBtn.setAttribute('aria-label', 'Open ' + file.name + ' in Drive');

        actions.appendChild(playBtn);
        actions.appendChild(downloadBtn);
        actions.appendChild(driveBtn);

        card.appendChild(icon);
        card.appendChild(info);
        card.appendChild(actions);

        fileList.appendChild(card);
      });
    }

    function playFile(file) {
      if (!file || !file.playUrl) return;

      state.currentId = file.id;
      nowTitle.textContent = file.name;
      player.src = file.playUrl;
      player.load();

      player.play().catch(function() {
        showMessage(
          'Playback did not start. The file may not be publicly accessible, ' +
          'or Google Drive may be showing a confirmation page instead of ' +
          'the audio stream. Check the file sharing settings or open it ' +
          'using the Drive button.'
        );
      });

      renderFiles();
    }

    searchInput.addEventListener('input', renderFiles);
    refreshBtn.addEventListener('click', loadFiles);

    player.addEventListener('error', function() {
      if (state.currentId) {
        showMessage(
          'The audio could not be played directly. Check that the file is ' +
          'shared as “Anyone with the link — Viewer”. Some Google Drive ' +
          'files may not stream directly in the browser.'
        );
      }
    });

    loadFiles();
  </script>
</body>
</html>
