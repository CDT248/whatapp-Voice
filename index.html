
<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Audio Library</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #0b1020;
      color: #f4f6ff;
      font-family: Arial, sans-serif;
    }

    .wrap {
      max-width: 900px;
      margin: auto;
      padding: 24px 16px 40px;
    }

    h1 { margin: 0 0 8px; font-size: 30px; }
    .sub { color: #a8b1c9; margin-bottom: 22px; }

    .stats, .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat, .panel, .item {
      background: #151e32;
      border: 1px solid #29334b;
      border-radius: 14px;
    }

    .stat {
      flex: 1;
      padding: 16px;
      min-width: 0;
    }

    .muted { color: #a8b1c9; font-size: 13px; }
    .number { font-size: 23px; font-weight: bold; margin-top: 7px; }

    input {
      flex: 1;
      min-width: 0;
      background: #151e32;
      border: 1px solid #35405b;
      border-radius: 10px;
      padding: 13px;
      color: white;
      font-size: 15px;
    }

    button, .btn {
      display: inline-block;
      padding: 11px 14px;
      border: 0;
      border-radius: 9px;
      background: #7868f6;
      color: white;
      text-decoration: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      text-align: center;
    }

    .btn-download { background: #176b58; }
    .btn-drive { background: #303c56; }

    #status {
      display: none;
      padding: 14px;
      margin: 12px 0;
      background: #241f37;
      border-radius: 10px;
      color: #e4dcff;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    h2 { font-size: 19px; margin: 24px 0 12px; }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px;
      margin-bottom: 10px;
    }

    .music-icon {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      background: #28264c;
      border-radius: 12px;
      font-size: 22px;
    }

    .info { flex: 1; min-width: 0; }
    .filename { font-weight: bold; overflow-wrap: anywhere; }
    .meta { margin-top: 6px; color: #a8b1c9; font-size: 12px; }

    .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .panel { padding: 16px; }

    #playerTitle {
      font-weight: bold;
      margin-bottom: 12px;
      overflow-wrap: anywhere;
    }

    #preview {
      display: block;
      width: 100%;
      height: 120px;
      border: 0;
      border-radius: 10px;
      background: #fff;
    }

    .hint {
      color: #a8b1c9;
      font-size: 12px;
      line-height: 1.6;
      margin-top: 10px;
    }

    @media(max-width: 600px) {
      .wrap { padding: 20px 11px; }
      h1 { font-size: 25px; }
      .toolbar { flex-wrap: wrap; }
      input { flex-basis: 100%; }
      .item { align-items: flex-start; flex-wrap: wrap; }
      .info { width: calc(100% - 60px); }
      .actions { width: 100%; padding-left: 54px; }
      .actions .btn { flex: 1; padding: 11px 8px; }
      #preview { height: 120px; }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <h1>♫ My Audio Library</h1>
    <div class="sub">Listen to and download audio from Google Drive.</div>

    <div class="stats">
      <div class="stat">
        <div class="muted">Total audio files</div>
        <div class="number" id="total">0</div>
      </div>
      <div class="stat">
        <div class="muted">Total size</div>
        <div class="number" id="totalSize">0 B</div>
      </div>
    </div>

    <div class="toolbar">
      <input id="search" type="search" placeholder="Search audio files...">
      <button id="refresh" type="button">Refresh</button>
    </div>

    <div id="status" role="status"></div>

    <h2>Audio files <span class="muted" id="count"></span></h2>
    <div id="list"></div>

    <h2>Audio player</h2>
    <div class="panel">
      <div id="playerTitle">Select a file below to listen</div>
      <iframe
        id="preview"
        title="Google Drive audio player"
        allow="autoplay"
        src="about:blank">
      </iframe>
      <div class="hint">
        The audio plays using Google Drive's built-in preview.
        If it does not play, check the file's sharing permissions.
      </div>
    </div>
  </main>

  <script>
    let allFiles = [];

    const list = document.getElementById('list');
    const statusBox = document.getElementById('status');
    const search = document.getElementById('search');
    const preview = document.getElementById('preview');
    const playerTitle = document.getElementById('playerTitle');

    function showStatus(text) {
      statusBox.textContent = text;
      statusBox.style.display = 'block';
    }

    function hideStatus() {
      statusBox.textContent = '';
      statusBox.style.display = 'none';
    }

    function sizeText(bytes) {
      if (!bytes) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.min(
        Math.floor(Math.log(bytes) / Math.log(1024)),
        units.length - 1
      );
      return (bytes / Math.pow(1024, i)).toFixed(i ? 1 : 0)
        + ' ' + units[i];
    }

    function loadFiles() {
      const refresh = document.getElementById('refresh');
      refresh.disabled = true;
      list.replaceChildren();
      showStatus('Loading files from Google Drive...');

      google.script.run
        .withSuccessHandler(function(files) {
          allFiles = Array.isArray(files) ? files : [];
          refresh.disabled = false;

          document.getElementById('total').textContent = allFiles.length;

          const total = allFiles.reduce(function(sum, file) {
            return sum + (Number(file.size) || 0);
          }, 0);

          document.getElementById('totalSize').textContent = sizeText(total);

          hideStatus();
          renderFiles();
        })
        .withFailureHandler(function(error) {
          refresh.disabled = false;
          showStatus(
            'Could not load files. Make sure the script has permission ' +
            'to access your Google Drive folder. Error: ' +
            (error && error.message ? error.message : 'Unknown error')
          );
          document.getElementById('count').textContent = '';
        })
        .getAudioFiles();
    }

    function makeButton(text, url, cssClass) {
      const a = document.createElement('a');
      a.className = 'btn ' + cssClass;
      a.textContent = text;
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      return a;
    }

    function renderFiles() {
      const q = search.value.trim().toLowerCase();

      const files = allFiles.filter(function(file) {
        return file.name.toLowerCase().includes(q);
      });

      list.replaceChildren();
      document.getElementById('count').textContent =
        '(' + files.length + ')';

      if (!allFiles.length) {
        showStatus(
          'No audio files found. Check that your folder contains audio ' +
          'files and that you authorized the Apps Script.'
        );
        return;
      }

      if (!files.length) {
        showStatus('No files match your search.');
        return;
      }

      hideStatus();

      files.forEach(function(file) {
        const item = document.createElement('div');
        item.className = 'item';

        const icon = document.createElement('div');
        icon.className = 'music-icon';
        icon.textContent = '♫';

        const info = document.createElement('div');
        info.className = 'info';

        const filename = document.createElement('div');
        filename.className = 'filename';
        filename.textContent = file.name;

        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = sizeText(Number(file.size) || 0);

        info.appendChild(filename);
        info.appendChild(meta);

        const actions = document.createElement('div');
        actions.className = 'actions';

        const play = document.createElement('button');
        play.type = 'button';
        play.textContent = '▶ Play';
        play.addEventListener('click', function() {
          playFile(file);
        });

        actions.appendChild(play);
        actions.appendChild(
          makeButton('↓ Download', file.downloadUrl, 'btn-download')
        );
        actions.appendChild(
          makeButton('Open Drive', file.driveUrl, 'btn-drive')
        );

        item.appendChild(icon);
        item.appendChild(info);
        item.appendChild(actions);
        list.appendChild(item);
      });
    }

    function playFile(file) {
      playerTitle.textContent = file.name;
      preview.src = file.previewUrl;
      preview.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    search.addEventListener('input', renderFiles);

    document.getElementById('refresh').addEventListener('click', loadFiles);

    loadFiles();
  </script>
</body>
</html>
